# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Deploy site to Bunny CDN

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Retrieve Infisical secrets
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: f7474818-0fd2-4814-a215-22ea95df5ac9
          project-id: 2f1bccca-e8b2-4daf-937c-adeefdbdfc59
          env-slug: prod
          secret-path: /Github
          domain: https://eu.infisical.com

      - name: Deploy to Edge Storage
        uses: own3d/bunny-action@main
        env:
          BUNNY_STORAGE_HOSTNAME: se.storage.bunnycdn.com
          BUNNY_STORAGE_USERNAME: celeroncool-nenimein-fi
          BUNNY_PULL_ZONE_ID: 5679250
        with:
          args: deploy --dir=public
